// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '1.3.72'
        retrofit_version = "2.4.0"
        okhttp_version = "3.12.0"
        gson_version = '2.8.2'

        compileSdkVersion = 28
        buildToolsVersion = '28.0.3'
        androidXLibraryVersion = '1.0.0'

        PUBLISH_GROUP_ID = 'com.theartofdev.edmodo'
        PUBLISH_ARTIFACT_ID = 'android-image-cropper'
        PUBLISH_VERSION = '2.8.0'
    }
    repositories {
        google()
        jcenter()
        mavenCentral()

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
        classpath 'com.google.gms:google-services:4.3.5'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.4.1'


    }
}


allprojects {
    repositories {
        google()
        gradlePluginPortal()
        jcenter()
        maven {
            url 'https://jitpack.io'
        }
        maven {
            url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'
        }
        maven() {
            url "https://sdk.digitsecure.com/repository/ds1033/" //replace with your url provided by digitsecure
            credentials {
                username "masafi" //replace with your user name provided by digitsecure
                password "Ds_M@safi"  //replace with your password name provided by digitsecure
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
