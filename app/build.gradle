    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.19'
    implementation 'com.itextpdf:itextg:5.5.10'
//    implementation 'com.sun.mail:android-mail:1.5.6'
//    implementation 'com.sun.mail:android-activation:1.5.6'
    implementation 'com.google.zxing:core:3.4.1'


    //implementation 'com.symbol:emdk:7.0.0'

    // reactive
    implementation "io.reactivex.rxjava2:rxjava:2.1.9"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.bignerdranch.android:simple-item-decoration:1.0.0'
    implementation('com.github.bumptech.glide:glide:4.7.1@aar') {
        transitive = true
    }

    implementation 'com.microsoft.identity.client:msal:2.0.+'
    implementation 'com.microsoft.graph:microsoft-graph:1.5.+'
   // implementation 'com.android.volley:volley:1.1.1'
    //implementation 'com.theartofdev.edmodo:android-image-cropper:2.3.1'
    //implementation 'com.vanniktech:android-image-cropper:4.6.0'

}

configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:20.0'
    }
    exclude group: 'com.google.guava', module: 'listenablefuture'
}
