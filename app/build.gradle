apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    namespace 'com.engear.vansales'

    defaultConfig {
        //applicationId "com.engear.vansales"
        minSdkVersion 31
        targetSdkVersion 29
        versionCode 344
        versionName "2.43"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dataBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding true
    }

//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }

    packagingOptions {
        exclude 'META-INF/atomicfu.kotlin_module'
        exclude 'META-INF/jersey-module-version'
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {

    implementation 'androidx.activity:activity:1.8.0'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core-ktx:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation project(path: ':materialVerticalStepper')
    implementation files('libs/hellocharts-library-1.5.8.jar')
    implementation files('libs/WoosimLib261.jar')
    implementation project(path: ':sdkOpenCv')
    api(project(':cropper')) {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'
    implementation 'com.digitsecure:dunnservice_plugin:1.1.35@aar'

    implementation 'com.google.android.material:material:1.2.0-beta01'
    implementation("com.github.gcacace:signature-pad:1.3.1")
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    implementation 'io.github.inflationx:viewpump:2.0.3'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'de.hdodenhof:circleimageview:3.0.1'
    //implementation 'com.wang.avi:library:2.1.3'
    //implementation 'com.shuhart.stepview:stepview:1.5.1'

    // implementation "com.fasterxml.jackson.core:jackson-core:2.15.3"
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'sh.locus:lotr.sdk:1.1.8'
    implementation 'sh.locus.lotr:lotr-javasdk:1.1.8'

    implementation(name: 'circularprogressbar-3.0.3', ext: 'aar')
    implementation(name: 'com.amulyakhare.textdrawable-1.0.1', ext: 'aar')
    implementation(name: 'library-2.1.3', ext: 'aar')
    implementation(name: 'stepview-1.5.1', ext: 'aar')
    implementation(name: 'viewpagerdotsindicator-3.0.3', ext: 'aar')
    implementation files('libs/emdk-7.0.0.jar')
    //implementation(name: 'volley-1.1.1', ext: 'aar')

    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
    implementation("com.squareup.retrofit2:retrofit:2.11.0")
    implementation("com.squareup.retrofit2:converter-gson:2.11.0")

    /*dependencies for Retrofit*/
 //   implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
//    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
//    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"
//    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
